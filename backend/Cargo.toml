[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
surrealdb = { version = "3.3", features = ["kv-surrealkv"] }
bollard = "0.21"
futures = "0.3"
tokio = { version = "1", features = ["rt", "sync", "macros", "process", "time"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
shared = { path = "../shared", features = ["ssr"] }
