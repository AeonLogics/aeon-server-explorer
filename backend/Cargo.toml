[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
surrealdb = { version = "3.3", features = ["kv-surrealkv"] }
bollard = "0.21"
futures = "0.3"
tokio = { version = "1", features = ["rt", "sync", "macros"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
thiserror = "2"
shared = { path = "../shared", features = ["ssr"] }
