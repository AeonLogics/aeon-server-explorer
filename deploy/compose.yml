name: aeon-server-explorer

# Goes to ~/services/aeon-server-explorer/compose.yml on the server, next to its .env.
services:
  explorer:
    image: aeon-server-explorer:latest
    container_name: aeon-server-explorer
    restart: unless-stopped
    # Host networking, so 127.0.0.1:5050 is the server's own loopback (reach it via an SSH tunnel).
    network_mode: host
    env_file: .env
    environment:
      DOCKER_CONFIG: /tmp/docker
    group_add:
      - "${DOCKER_GID:?set DOCKER_GID in .env}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Same path inside and out, so Redeploy finds each stack's compose file.
      - /home/aeon/services:/home/aeon/services:ro
      - explorer-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  explorer-data:
